name: MemPulse
options:
  bundleIdPrefix: com.yfofficial
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  MemPulse:
    type: application
    platform: macOS
    sources:
      - path: MemPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yfofficial.MemPulse
        PRODUCT_NAME: MemPulse
        INFOPLIST_FILE: MemPulse/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: MemPulse/Services/CMemoryBridge.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.yfofficial.MemPulse.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.yfofficial.MemPulse
    scheme:
      testTargets:
        - MemPulseTests
  MemPulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MemPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yfofficial.MemPulseTests
        GENERATE_INFOPLIST_FILE: YES
